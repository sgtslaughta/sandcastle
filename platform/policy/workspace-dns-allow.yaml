# External DNS names every workspace may *resolve*. This is the place to permit
# a name: one entry per line under dns, then `make policy`. Phase 4 hands this
# object to sandcastle-admin, per zone.
#
# Resolving is not reaching. Connections still need a grant in
# workspaces.yaml or the egress gate's allowlist, so a name here opens no
# path. Add a name when legitimate tooling looks it up before using a path
# that is allowed, and the refused lookup would otherwise be a policy drop:
# noise in the stream that must page on real escape attempts.
#
# Example: a closed network whose tooling resolves an internal registry or
# artifact host by name before using an allowed path; list that hostname.
#
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: workspace-dns-allow
  namespace: sandcastle-workspaces
spec:
  endpointSelector: {}
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports:
            - {port: "53", protocol: UDP}
            - {port: "53", protocol: TCP}
          rules:
            dns:
              # ponytail: placeholder so the list is never empty (an empty dns
              # rule would allow every name). .invalid is reserved and never
              # resolves. Replace or append real names.
              - matchName: "sandcastle.invalid"

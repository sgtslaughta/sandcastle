# Coder's own metadata database. Password lives in Secret `coder-db`,
# generated by infra/bootstrap/03-platform.sh (not committed here).
apiVersion: v1
kind: Service
metadata:
  name: coder-db
  namespace: coder
spec:
  type: ClusterIP
  selector:
    app: coder-db
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: coder-db
  namespace: coder
spec:
  serviceName: coder-db
  replicas: 1
  selector:
    matchLabels:
      app: coder-db
  template:
    metadata:
      labels:
        app: coder-db
    spec:
      containers:
        - name: postgres
          image: postgres:17.6
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: coder
            - name: POSTGRES_DB
              value: coder
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: coder-db
                  key: password
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "coder"]
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: local-path
        resources:
          requests:
            storage: 5Gi

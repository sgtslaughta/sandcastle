apiVersion: apps/v1
kind: Deployment
metadata:
  name: llm-d
  namespace: llm-d
  labels:
    app.kubernetes.io/name: llm-d
    app.kubernetes.io/component: inference-engine
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: llm-d
  template:
    metadata:
      labels:
        app.kubernetes.io/name: llm-d
    spec:
      containers:
        - name: server
          image: vllm/vllm-openai:latest
          command: ["python3", "-m", "vllm.entrypoints.openai.api_server"]
          args:
            - "--model"
            - "unsloth/gemma-2-2b-it"
            - "--served-model-name"
            - "gemma"
            - "--device"
            - "cpu"
            - "--dtype"
            - "bfloat16"
            - "--max-model-len"
            - "2048"
            - "--port"
            - "8000"
            - "--host"
            - "0.0.0.0"
          ports:
            - containerPort: 8000
              name: http
          env:
            - name: VLLM_TARGET_DEVICE
              value: "cpu"
            - name: HF_HOME
              value: "/root/.cache/huggingface"
          resources:
            requests:
              cpu: "2"
              memory: "6Gi"
            limits:
              cpu: "4"
              memory: "10Gi"
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 45
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 90
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 5
          volumeMounts:
            - name: model-cache
              mountPath: /root/.cache
      volumes:
        - name: model-cache
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: llm-d
  namespace: llm-d
  labels:
    app.kubernetes.io/name: llm-d
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8000
      targetPort: http
  selector:
    app.kubernetes.io/name: llm-d

apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: librechat
  namespace: flux-system
spec:
  interval: 5m0s
  timeout: 10m0s
  targetNamespace: librechat
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  chart:
    spec:
      chart: librechat
      version: "2.x"
      sourceRef:
        kind: HelmRepository
        name: librechat
        namespace: flux-system
      interval: 5m0s
  values:
    meilisearch:
      enabled: false
    redis:
      enabled: false
    librechat-rag-api:
      enabled: false
    global:
      librechat:
        existingSecretName: "librechat-credentials-env"
    librechat:
      configYamlContent: |
        version: 1.2.1
        cache: true
        endpoints:
          custom:
            - name: "kagent"
              apiKey: "kagent"
              baseURL: "http://kagent-openai-proxy.kagent.svc.cluster.local:8000/v1"
              models:
                default: ["nemotron-agent"]
                fetch: true
              titleConvo: true
              titleModel: "nemotron-agent"
              modelDisplayLabel: "Kagent"
        mcpServers:
          kagent-tools:
            type: sse
            url: "http://kagent-kagent-tools.kagent.svc.cluster.local:8084/mcp"

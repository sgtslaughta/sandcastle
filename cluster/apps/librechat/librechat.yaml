apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: librechat
  namespace: flux-system
spec:
  interval: 5m0s
  timeout: 10m0s
  targetNamespace: librechat
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  chart:
    spec:
      chart: librechat
      version: "2.x"
      sourceRef:
        kind: HelmRepository
        name: librechat
        namespace: flux-system
      interval: 5m0s
  values:
    meilisearch:
      enabled: false
    redis:
      enabled: false
    librechat-rag-api:
      enabled: false
    global:
      librechat:
        existingSecretName: "librechat-credentials-env"
    strategy:
      type: Recreate
    ingress:
      enabled: false
    hostAliases:
      - ip: "172.20.26.32"
        hostnames:
          - "auth.example.com"
          - "chat.example.com"
    librechat:
      configEnv:
        ALLOW_INSECURE_DOMAINS: "true"
        NODE_TLS_REJECT_UNAUTHORIZED: "0"
        SCHEDULES_SINGLE_PROCESS: "true"
        DOMAIN_CLIENT: "https://chat.example.com"
        DOMAIN_SERVER: "https://chat.example.com"
        ALLOW_SOCIAL_LOGIN: "true"
        ALLOW_SOCIAL_REGISTRATION: "true"
        OPENID_CLIENT_ID: "librechat"
        OPENID_CLIENT_SECRET: "librechat-client-secret"
        OPENID_ISSUER: "https://auth.example.com"
        OPENID_SESSION_SECRET: "7f4c0a1843b44b8296a152345e678901"
        OPENID_SCOPE: "openid profile email offline_access"
        OPENID_CALLBACK_URL: "https://chat.example.com/oauth/openid/callback"
        OPENID_BUTTON_LABEL: "Authelia SSO"
        CHECK_EMAIL_DOMAIN: "false"
      configYamlContent: |
        version: 1.2.1
        cache: true
        endpoints:
          custom:
            - name: "kagent"
              apiKey: "kagent"
              baseURL: "http://kagent-openai-proxy.kagent.svc.cluster.local:8000/v1"
              models:
                default: ["gemma", "nemotron"]
                fetch: true
              titleConvo: true
              titleModel: "gemma"
              modelDisplayLabel: "Kagent (Gemma)"
        mcpServers:
          kagent-tools:
            type: sse
            url: "http://kagent-kagent-tools.kagent.svc.cluster.local:8084/mcp"

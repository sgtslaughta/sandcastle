apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: librechat
  namespace: flux-system
spec:
  interval: 5m0s
  timeout: 10m0s
  targetNamespace: librechat
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  chart:
    spec:
      chart: librechat
      version: "2.x"
      sourceRef:
        kind: HelmRepository
        name: librechat
        namespace: flux-system
      interval: 5m0s
  values:
    meilisearch:
      enabled: false
    redis:
      enabled: false
    librechat-rag-api:
      enabled: false
    global:
      librechat:
        existingSecretName: "librechat-credentials-env"
    strategy:
      type: Recreate
    ingress:
      enabled: false
    hostAliases:
      - ip: "172.20.26.32"
        hostnames:
          - "auth.example.com"
          - "chat.example.com"
          - "git.example.com"
    librechat:
      configEnv:
        ALLOW_INSECURE_DOMAINS: "true"
        NODE_TLS_REJECT_UNAUTHORIZED: "0"
        SCHEDULES_SINGLE_PROCESS: "true"
        DOMAIN_CLIENT: "https://chat.example.com"
        DOMAIN_SERVER: "https://chat.example.com"
        ALLOW_SOCIAL_LOGIN: "true"
        ALLOW_SOCIAL_REGISTRATION: "true"
        OPENID_CLIENT_ID: "librechat"
        OPENID_CLIENT_SECRET: "librechat-client-secret"
        OPENID_ISSUER: "https://auth.example.com"
        OPENID_SESSION_SECRET: "7f4c0a1843b44b8296a152345e678901"
        OPENID_SCOPE: "openid profile email offline_access"
        OPENID_CALLBACK_URL: "/oauth/openid/callback"
        OPENID_BUTTON_LABEL: "Authelia SSO"
        CHECK_EMAIL_DOMAIN: "false"
      configYamlContent: |
        version: 1.2.1
        cache: true
        endpoints:
          custom:
            - name: "kaito"
              apiKey: "kaito"
              baseURL: "http://traefik-traefik.traefik.svc.cluster.local:80/v1"
              models:
                default: ["gemma"]
                fetch: false
              titleConvo: true
              titleModel: "gemma"
              modelDisplayLabel: "KAITO (Gemma)"
        mcpSettings:
          allowedDomains:
            - "*.cluster.local"
            - "kagent-kagent-tools.kagent.svc.cluster.local"
            - "gitea-mcp.gitea.svc.cluster.local"
            - "git.example.com"
            - "*.example.com"
        mcpServers:
          kagent-tools:
            type: streamable-http
            url: "http://kagent-kagent-tools.kagent.svc.cluster.local:8084/mcp"
            requiresOAuth: false
          gitea:
            type: streamable-http
            url: "http://gitea-mcp.gitea.svc.cluster.local:8000/mcp"
            requiresOAuth: true
            oauth:
              authorization_url: "https://git.example.com/login/oauth/authorize"
              token_url: "https://git.example.com/login/oauth/access_token"
              client_id: "94f365a0-2eb4-4a8f-afc2-fe958936b930"
              client_secret: "gto_khshofjpt2blmvl5a6fmlwuausct3oyu7gwl6mn4leh3uqvs3i6a"
              scope: "all"

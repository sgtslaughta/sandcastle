apiVersion: ate.dev/v1alpha1
kind: WorkerPool
metadata:
  name: kagent-default
  namespace: kagent
spec:
  replicas: 1
  sandboxClass: gvisor
  ateomImage: ghcr.io/kagent-dev/substrate/ateom-gvisor:v0.0.9
---
apiVersion: kagent.dev/v1alpha2
kind: SandboxAgent
metadata:
  name: nemotron-agent
  namespace: kagent
spec:
  type: Declarative
  declarative:
    runtime: go
    modelConfig: nemotron
    systemMessage: |
      You are an NVIDIA Nemotron assistant running inside an Agent Substrate sandbox in Kubernetes. You assist users with cloud-native tasks, cluster operations, and reasoning.
  substrate:
    workerPoolRef:
      name: kagent-default

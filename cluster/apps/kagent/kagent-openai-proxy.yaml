apiVersion: v1
kind: ConfigMap
metadata:
  name: kagent-openai-proxy-code
  namespace: kagent
data:
  proxy.py: |
    import http.server
    import json
    import time
    import urllib.request
    import urllib.error
    import os
    import sys
    import boto3

    KAGENT_URL = os.environ.get("KAGENT_URL", "http://kagent-kagent-controller.kagent.svc:8083")
    BEDROCK_REGION = os.environ.get("BEDROCK_REGION", "us-west-2")
    DEFAULT_MODEL = os.environ.get("DEFAULT_MODEL", "nvidia.nemotron-nano-9b-v2")

    bedrock_client = boto3.client("bedrock-runtime", region_name=BEDROCK_REGION)

    def query_kagent_agents():
        try:
            req = urllib.request.Request(f"{KAGENT_URL}/api/agents", headers={"Accept": "application/json"})
            with urllib.request.urlopen(req, timeout=3) as resp:
                data = json.loads(resp.read().decode())
                agents = []
                for item in data.get("agents", []):
                    name = item.get("metadata", {}).get("name")
                    if name:
                        agents.append(name)
                return agents
        except Exception as e:
            print(f"Error querying kagent agents: {e}", file=sys.stderr)
            return ["nemotron-agent"]

    def call_bedrock(messages, model_id=DEFAULT_MODEL):
        converse_messages = []
        system_prompts = []
        for m in messages:
            role = m.get("role", "user")
            content = m.get("content", "")
            if role == "system":
                system_prompts.append({"text": content})
            elif role in ("user", "assistant"):
                converse_messages.append({"role": role, "content": [{"text": content}]})

        if not converse_messages:
            converse_messages.append({"role": "user", "content": [{"text": "Hello"}]})

        kwargs = {
            "modelId": model_id,
            "messages": converse_messages,
        }
        if system_prompts:
            kwargs["system"] = system_prompts

        resp = bedrock_client.converse(**kwargs)
        output = resp.get("output", {}).get("message", {}).get("content", [])
        text = "".join([c.get("text", "") for c in output if "text" in c])
        return text

    def call_kagent(agent_name, prompt):
        # Try kagent A2A JSON-RPC
        try:
            payload = {
                "jsonrpc": "2.0",
                "id": "1",
                "method": "message/send",
                "params": {
                    "message": {
                        "role": "user",
                        "parts": [{"text": prompt}]
                    }
                }
            }
            req = urllib.request.Request(
                f"{KAGENT_URL}/api/a2a/kagent/{agent_name}/",
                data=json.dumps(payload).encode("utf-8"),
                headers={"Content-Type": "application/json"},
                method="POST"
            )
            with urllib.request.urlopen(req, timeout=10) as resp:
                data = json.loads(resp.read().decode())
                result = data.get("result", {})
                parts = result.get("message", {}).get("parts", [])
                text = "".join([p.get("text", "") for p in parts if "text" in p])
                if text:
                    return text
        except Exception as e:
            print(f"kagent A2A fallback to Bedrock: {e}", file=sys.stderr)
        return None

    class Handler(http.server.BaseHTTPRequestHandler):
        def do_OPTIONS(self):
            self.send_response(200)
            self.send_header("Access-Control-Allow-Origin", "*")
            self.send_header("Access-Control-Allow-Methods", "GET, POST, OPTIONS")
            self.send_header("Access-Control-Allow-Headers", "*")
            self.end_headers()

        def do_GET(self):
            if self.path in ("/v1/models", "/models"):
                self.send_response(200)
                self.send_header("Content-Type", "application/json")
                self.send_header("Access-Control-Allow-Origin", "*")
                self.end_headers()

                agents = query_kagent_agents()
                model_entries = []
                for a in agents:
                    model_entries.append({
                        "id": a,
                        "object": "model",
                        "created": int(time.time()),
                        "owned_by": "kagent",
                        "name": f"kagent: {a}"
                    })
                if "nemotron-agent" not in agents:
                    model_entries.append({
                        "id": "nemotron-agent",
                        "object": "model",
                        "created": int(time.time()),
                        "owned_by": "kagent",
                        "name": "Nemotron Agent (kagent)"
                    })
                model_entries.append({
                    "id": "nvidia.nemotron-nano-9b-v2",
                    "object": "model",
                    "created": int(time.time()),
                    "owned_by": "kagent",
                    "name": "NVIDIA Nemotron Nano 9B v2 (Bedrock)"
                })

                resp = {"object": "list", "data": model_entries}
                self.wfile.write(json.dumps(resp).encode("utf-8"))
            elif self.path in ("/healthz", "/health"):
                self.send_response(200)
                self.send_header("Content-Type", "text/plain")
                self.end_headers()
                self.wfile.write(b"ok")
            else:
                self.send_response(404)
                self.end_headers()

        def do_POST(self):
            if self.path in ("/v1/chat/completions", "/chat/completions"):
                content_length = int(self.headers.get("Content-Length", 0))
                body = self.rfile.read(content_length)
                req = json.loads(body.decode("utf-8"))
                model = req.get("model", "nemotron-agent")
                stream = req.get("stream", False)
                messages = req.get("messages", [])

                # Extract last user query
                user_query = ""
                for m in reversed(messages):
                    if m.get("role") == "user":
                        user_query = m.get("content", "")
                        break

                print(f"Received completion request for model {model}: {user_query}", file=sys.stderr)

                # Try kagent invocation first
                reply = call_kagent(model, user_query)
                if not reply:
                    # Direct Bedrock fallback
                    reply = call_bedrock(messages)

                if stream:
                    self.send_response(200)
                    self.send_header("Content-Type", "text/event-stream")
                    self.send_header("Cache-Control", "no-cache")
                    self.send_header("Connection", "keep-alive")
                    self.send_header("Access-Control-Allow-Origin", "*")
                    self.end_headers()

                    chunk = {
                        "id": f"chatcmpl-{int(time.time())}",
                        "object": "chat.completion.chunk",
                        "created": int(time.time()),
                        "model": model,
                        "choices": [{
                            "index": 0,
                            "delta": {"role": "assistant", "content": reply},
                            "finish_reason": "stop"
                        }]
                    }
                    self.wfile.write(f"data: {json.dumps(chunk)}\n\n".encode("utf-8"))
                    self.wfile.write(b"data: [DONE]\n\n")
                    self.wfile.flush()
                else:
                    self.send_response(200)
                    self.send_header("Content-Type", "application/json")
                    self.send_header("Access-Control-Allow-Origin", "*")
                    self.end_headers()

                    resp = {
                        "id": f"chatcmpl-{int(time.time())}",
                        "object": "chat.completion",
                        "created": int(time.time()),
                        "model": model,
                        "choices": [{
                            "index": 0,
                            "message": {"role": "assistant", "content": reply},
                            "finish_reason": "stop"
                        }],
                        "usage": {
                            "prompt_tokens": len(user_query.split()),
                            "completion_tokens": len(reply.split()),
                            "total_tokens": len(user_query.split()) + len(reply.split())
                        }
                    }
                    self.wfile.write(json.dumps(resp).encode("utf-8"))
            else:
                self.send_response(404)
                self.end_headers()

    if __name__ == "__main__":
        server = http.server.HTTPServer(("0.0.0.0", 8000), Handler)
        print("Starting kagent-OpenAI proxy on port 8000...", file=sys.stderr)
        server.serve_forever()
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kagent-openai-proxy
  namespace: kagent
  labels:
    app: kagent-openai-proxy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kagent-openai-proxy
  template:
    metadata:
      labels:
        app: kagent-openai-proxy
    spec:
      containers:
        - name: proxy
          image: python:3.12-alpine
          command: ["/bin/sh", "-c"]
          args:
            - |
              pip install --no-cache-dir boto3 urllib3
              python -u /app/proxy.py
          ports:
            - containerPort: 8000
              name: http
          env:
            - name: KAGENT_URL
              value: "http://kagent-kagent-controller.kagent.svc:8083"
            - name: BEDROCK_REGION
              value: "us-west-2"
            - name: DEFAULT_MODEL
              value: "nvidia.nemotron-nano-9b-v2"
          volumeMounts:
            - name: code
              mountPath: /app
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
      volumes:
        - name: code
          configMap:
            name: kagent-openai-proxy-code
---
apiVersion: v1
kind: Service
metadata:
  name: kagent-openai-proxy
  namespace: kagent
  labels:
    app: kagent-openai-proxy
spec:
  type: ClusterIP
  ports:
    - port: 8000
      targetPort: http
      name: http
  selector:
    app: kagent-openai-proxy

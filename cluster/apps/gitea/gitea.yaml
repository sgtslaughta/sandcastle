apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: gitea
  namespace: flux-system
spec:
  interval: 5m0s
  timeout: 10m0s
  targetNamespace: gitea
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  chart:
    spec:
      chart: gitea
      version: "10.x"
      sourceRef:
        kind: HelmRepository
        name: gitea
        namespace: flux-system
      interval: 5m0s
  values:
    gitea:
      config:
        APP_NAME: "Sandcastle Git"
        security:
          INSTALL_LOCK: true
          SECRET_KEY: "sandcastle-gitea-secret-key-32ch"
        server:
          DOMAIN: "git.example.com"
          ROOT_URL: "https://git.example.com/"
          HTTP_PORT: 3000
        database:
          DB_TYPE: "sqlite3"
          PATH: "/data/gitea/gitea.db"
        service:
          DISABLE_REGISTRATION: false
          ALLOW_ONLY_EXTERNAL_REGISTRATION: true
          SHOW_REGISTRATION_BUTTON: false
        oauth2_client:
          ENABLE: true
        oauth2:
          ENABLE: true
        openid:
          ENABLE_OPENID_SIGNIN: true
          ENABLE_OPENID_SIGNUP: true
    persistence:
      enabled: true
      size: 10Gi
      storageClass: gp3
    postgresql:
      enabled: false
    postgresql-ha:
      enabled: false
    redis-cluster:
      enabled: false
    valkey-cluster:
      enabled: false
    ingress:
      enabled: false

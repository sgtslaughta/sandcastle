apiVersion: v1
kind: ServiceAccount
metadata:
  name: litellm
  namespace: kaito-workspace
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: litellm-kaito-watcher
  namespace: kaito-workspace
rules:
  - apiGroups: ["kaito.sh"]
    resources: ["workspaces"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: litellm-kaito-watcher
  namespace: kaito-workspace
subjects:
  - kind: ServiceAccount
    name: litellm
    namespace: kaito-workspace
roleRef:
  kind: Role
  name: litellm-kaito-watcher
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: litellm-config
  namespace: kaito-workspace
data:
  config.yaml: |
    model_list:
      - model_name: gemma
        litellm_params:
          model: openai/gemma
          api_base: http://gemma.kaito-workspace.svc.cluster.local:80/v1
          api_key: kaito
      - model_name: google/gemma-4-E2B-it
        litellm_params:
          model: openai/gemma
          api_base: http://gemma.kaito-workspace.svc.cluster.local:80/v1
          api_key: kaito
    general_settings:
      master_key: "sk-kaito-litellm-master-key"
    litellm_settings:
      drop_params: true
      set_verbose: false
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: litellm-watcher
  namespace: kaito-workspace
data:
  watcher.py: |
    import json
    import os
    import ssl
    import time
    import urllib.error
    import urllib.request

    K8S_API = "https://kubernetes.default.svc"
    TOKEN_PATH = "/var/run/secrets/kubernetes.io/serviceaccount/token"
    CA_PATH = "/var/run/secrets/kubernetes.io/serviceaccount/ca.crt"
    LITELLM_URL = "http://127.0.0.1:4000"
    MASTER_KEY = os.environ.get("LITELLM_MASTER_KEY", "sk-kaito-litellm-master-key")
    NAMESPACE = os.environ.get("NAMESPACE", "kaito-workspace")

    def get_k8s_workspaces():
        try:
            with open(TOKEN_PATH, "r") as f:
                token = f.read().strip()
            ctx = ssl.create_default_context(cafile=CA_PATH)
            url = f"{K8S_API}/apis/kaito.sh/v1beta1/namespaces/{NAMESPACE}/workspaces"
            req = urllib.request.Request(url, headers={"Authorization": f"Bearer {token}", "Accept": "application/json"})
            with urllib.request.urlopen(req, context=ctx, timeout=10) as resp:
                data = json.loads(resp.read().decode())
                return data.get("items", [])
        except Exception as e:
            print(f"[watcher] Error fetching workspaces from k8s: {e}", flush=True)
            return []

    def get_litellm_models():
        try:
            url = f"{LITELLM_URL}/v1/models"
            req = urllib.request.Request(url, headers={"Authorization": f"Bearer {MASTER_KEY}"})
            with urllib.request.urlopen(req, timeout=5) as resp:
                data = json.loads(resp.read().decode())
                return [m.get("id") for m in data.get("data", [])]
        except Exception as e:
            print(f"[watcher] LiteLLM not ready yet: {e}", flush=True)
            return None

    def register_model(name, target_model=None):
        target = target_model or name
        payload = {
            "model_name": name,
            "litellm_params": {
                "model": f"openai/{target}",
                "api_base": f"http://{target}.{NAMESPACE}.svc.cluster.local:80/v1",
                "api_key": "kaito"
            }
        }
        try:
            url = f"{LITELLM_URL}/model/new"
            data = json.dumps(payload).encode("utf-8")
            req = urllib.request.Request(url, data=data, headers={"Authorization": f"Bearer {MASTER_KEY}", "Content-Type": "application/json"})
            with urllib.request.urlopen(req, timeout=5) as resp:
                print(f"[watcher] Successfully registered model '{name}' -> http://{target}.{NAMESPACE}.svc:80/v1", flush=True)
        except Exception as e:
            print(f"[watcher] Error registering model '{name}': {e}", flush=True)

    def main():
        print("[watcher] Starting KAITO workspace dynamic model registrar for LiteLLM...", flush=True)
        # Wait for LiteLLM to be responsive
        while True:
            models = get_litellm_models()
            if models is not None:
                print(f"[watcher] LiteLLM is responsive. Current models: {models}", flush=True)
                break
            time.sleep(2)

        while True:
            try:
                current_models = set(get_litellm_models() or [])
                workspaces = get_k8s_workspaces()
                for ws in workspaces:
                    name = ws.get("metadata", {}).get("name")
                    if not name:
                        continue
                    # Register primary name
                    if name not in current_models:
                        print(f"[watcher] Found new workspace '{name}', registering in LiteLLM...", flush=True)
                        register_model(name)
                        current_models.add(name)

                    # Register preset name if defined
                    preset = ws.get("spec", {}).get("inference", {}).get("preset", {}).get("name")
                    if preset and preset not in current_models:
                        print(f"[watcher] Registering preset alias '{preset}' for workspace '{name}'...", flush=True)
                        register_model(preset, target_model=name)
                        current_models.add(preset)
            except Exception as e:
                print(f"[watcher] Loop error: {e}", flush=True)

            time.sleep(10)

    if __name__ == "__main__":
        main()
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: litellm
  namespace: kaito-workspace
  labels:
    app.kubernetes.io/name: litellm
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: litellm
  template:
    metadata:
      labels:
        app.kubernetes.io/name: litellm
    spec:
      serviceAccountName: litellm
      containers:
        - name: litellm
          image: ghcr.io/berriai/litellm:main-latest
          imagePullPolicy: IfNotPresent
          command:
            - litellm
            - --config
            - /app/config.yaml
            - --port
            - "4000"
            - --host
            - "0.0.0.0"
          env:
            - name: LITELLM_MASTER_KEY
              value: "sk-kaito-litellm-master-key"
          ports:
            - name: http
              containerPort: 4000
          readinessProbe:
            httpGet:
              path: /health/readiness
              port: 4000
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health/liveness
              port: 4000
            initialDelaySeconds: 20
            periodSeconds: 15
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          volumeMounts:
            - name: config
              mountPath: /app/config.yaml
              subPath: config.yaml
              readOnly: true
        - name: kaito-watcher
          image: python:3.11-alpine
          imagePullPolicy: IfNotPresent
          command:
            - python3
            - -u
            - /app/watcher.py
          env:
            - name: LITELLM_MASTER_KEY
              value: "sk-kaito-litellm-master-key"
            - name: NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
          volumeMounts:
            - name: watcher-script
              mountPath: /app
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: litellm-config
        - name: watcher-script
          configMap:
            name: litellm-watcher
---
apiVersion: v1
kind: Service
metadata:
  name: litellm
  namespace: kaito-workspace
  labels:
    app.kubernetes.io/name: litellm
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 4000
      targetPort: 4000
  selector:
    app.kubernetes.io/name: litellm

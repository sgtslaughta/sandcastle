apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kaito
  namespace: flux-system
spec:
  interval: 5m0s
  timeout: 10m0s
  targetNamespace: kaito-workspace
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  chart:
    spec:
      chart: workspace
      version: "0.x"
      sourceRef:
        kind: HelmRepository
        name: kaito
        namespace: flux-system
      interval: 5m0s
  values:
    cloudProviderName: "aws"
    clusterName: "ai-agent-cluster"
    nodeProvisioner: "karpenter"
    karpenterProvider: "aws"
    karpenterProviders:
      aws:
        group: "karpenter.k8s.aws"
        kind: "EC2NodeClass"
        version: "v1"
        resourceName: "ec2nodeclasses"
        nodeClasses:
          - name: "gpu"
            default: true
            spec:
              role: "Karpenter-ai-agent-cluster-37b3fd9e694c32bd65e619901c"
              amiFamily: "Bottlerocket"
              amiSelectorTerms:
                - alias: "bottlerocket@latest"
              blockDeviceMappings:
                - deviceName: "/dev/xvdb"
                  ebs:
                    volumeSize: "100Gi"
                    volumeType: "gp3"
                    deleteOnTermination: true
              subnetSelectorTerms:
                - tags:
                    karpenter.sh/discovery: "ai-agent-cluster"
              securityGroupSelectorTerms:
                - tags:
                    karpenter.sh/discovery: "ai-agent-cluster"
              tags:
                karpenter.sh/discovery: "ai-agent-cluster"
    featureGates:
      gatewayAPIInferenceExtension: true
    flux2:
      helmController:
        create: false
      sourceController:
        create: false
    nvidiaDevicePlugin:
      enabled: false

apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: kaito-inference
  namespace: kaito-workspace
spec:
  parentRefs:
    - name: traefik-gateway
      namespace: traefik
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /v1
      backendRefs:
        - name: litellm
          port: 4000

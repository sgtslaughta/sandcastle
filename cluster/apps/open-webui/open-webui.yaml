apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: open-webui
  namespace: flux-system
spec:
  interval: 5m0s
  targetNamespace: open-webui
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  chart:
    spec:
      chart: open-webui
      version: "16.x"
      sourceRef:
        kind: HelmRepository
        name: open-webui
        namespace: flux-system
      interval: 5m0s

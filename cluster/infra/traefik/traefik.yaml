apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: traefik
  namespace: flux-system
spec:
  interval: 5m0s
  timeout: 10m0s
  targetNamespace: traefik
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  chart:
    spec:
      chart: traefik
      version: "41.x"
      sourceRef:
        kind: HelmRepository
        name: traefik
        namespace: flux-system
      interval: 5m0s
  values:
    deployment:
      replicas: 1
    providers:
      kubernetesCRD:
        enabled: true
        allowCrossNamespace: true
      kubernetesGateway:
        enabled: true
    gateway:
      enabled: true
      name: traefik-gateway
      namespace: traefik
      listeners:
        web:
          port: 8000
          protocol: HTTP
          namespacePolicy:
            from: All
        websecure:
          port: 8443
          protocol: HTTPS
          certificateRefs:
            - name: example-wildcard-tls
          namespacePolicy:
            from: All
    service:
      type: LoadBalancer
    ingressClass:
      enabled: true
      isDefaultClass: true

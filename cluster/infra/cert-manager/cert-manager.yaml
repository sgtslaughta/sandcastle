apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cert-manager
  namespace: flux-system
spec:
  interval: 5m0s
  timeout: 10m0s
  targetNamespace: cert-manager
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  chart:
    spec:
      chart: cert-manager
      version: "v1.x"
      sourceRef:
        kind: HelmRepository
        name: cert-manager
        namespace: flux-system
      interval: 5m0s
  values:
    crds:
      enabled: true
    # Run 1 replica for test environment
    replicaCount: 1
    webhook:
      replicaCount: 1
    cainjector:
      replicaCount: 1
